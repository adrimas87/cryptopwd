<!doctype html>
<meta charset="utf-8">
<title>CryptoPwd e2e</title>
<style>iframe { width: 420px; height: 760px; border: 1px solid #ccc; } pre { font-size: 12px; }</style>
<iframe id="f"></iframe>
<pre id="out">running</pre>
<script type="module">
// Test end-to-end: l'app vera in un iframe, con Google/Drive simulati (fake-google.js).
// Richiede un GOOGLE_CLIENT_ID qualsiasi (non segnaposto) in js/config.js durante il test.
import * as C from '../js/crypto.js';

const frame = document.getElementById('f');
const results = [];
const log = (s) => { results.push(s); document.getElementById('out').textContent = results.join('\n'); };
const ok = (name, cond) => log(`${cond ? 'PASS' : 'FAIL'} ${name}`);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const d = () => frame.contentDocument;
const $ = (id) => d().getElementById(id);
const visible = (id) => $(id) && !$(id).hidden;

async function waitFor(fn, what, ms = 20000) {
  const t0 = Date.now();
  for (;;) {
    try { if (await fn()) return true; } catch { /* riprova */ }
    if (Date.now() - t0 > ms) throw new Error(`timeout: ${what}`);
    await sleep(100);
  }
}

async function deleteDb() {
  await new Promise((r) => { frame.onload = r; frame.srcdoc = '<p>blank</p>'; });
  await new Promise((res, rej) => {
    const q = indexedDB.deleteDatabase('cryptopwd');
    q.onsuccess = res; q.onerror = rej; q.onblocked = () => setTimeout(res, 500);
  });
}

async function loadApp() {
  const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
  const inj = html
    .replace('<head>', '<head><base href="/">')
    .replace('<script type="module"', '<script src="tests/fake-google.js"><\/script><script type="module"');
  await new Promise((r) => { frame.onload = r; frame.srcdoc = inj; });
}

function fill(id, v) { $(id).value = v; $(id).dispatchEvent(new Event('input', { bubbles: true })); }
const titles = () => [...d().querySelectorAll('#list .item-title')].map((n) => n.textContent).sort();
const vaultFile = () => Object.values(window.fakeDrive.files).find((f) => f.name === 'cryptopwd-vault.json');
const driveBlob = () => { const f = vaultFile(); return f && JSON.parse(f.content); };
const driveAtts = () => Object.values(window.fakeDrive.files).filter((f) => f.name.startsWith('cryptopwd-att-'));
async function driveData(pwd) { return (await C.openWithPassword(pwd, driveBlob())).data; }
const live = (data) => data.entries.filter((e) => !e.deleted && !e.trashedAt).map((e) => e.title).sort();
const trashed = (data) => data.entries.filter((e) => !e.deleted && e.trashedAt).map((e) => e.title).sort();

async function addEntry(title, pwd) {
  $('btn-add').click();
  fill('e-title', title); fill('e-user', title.toLowerCase() + '@x.it'); fill('e-pwd', pwd);
  $('form-edit').requestSubmit();
  await waitFor(() => titles().includes(title), `voce ${title} in elenco`);
}

const V_trashCount = () => Number($('trash-count').textContent);
const P1 = 'prima-password-123', P2 = 'seconda-password-456';

try {
  // 1. Dispositivo A: nuovo archivio con Drive
  await deleteDb(); await loadApp();
  await waitFor(() => visible('screen-setup'), 'schermata setup');
  fill('create-pwd', P1); fill('create-pwd2', P1); $('create-drive').checked = true;
  $('form-create').requestSubmit();
  await waitFor(() => visible('screen-main'), 'schermata principale');
  await waitFor(() => driveBlob(), 'file creato su Drive');
  ok('1. archivio creato e caricato su Drive', !!driveBlob());

  await addEntry('Gmail', 'g-secret');
  await waitFor(async () => live(await driveData(P1)).includes('Gmail'), 'Gmail su Drive');
  ok('1. nuova voce sincronizzata su Drive (cifrata)', !vaultFile().content.includes('g-secret'));

  // 2. Dispositivo B: ripristino da Drive
  await deleteDb(); await loadApp();
  await waitFor(() => visible('screen-setup'), 'setup su B');
  $('btn-restore').click();
  await waitFor(() => $('dlg-prompt').open, 'richiesta password');
  fill('p-input', 'sbagliata'); $('form-prompt').requestSubmit();
  await waitFor(() => !$('p-error').hidden, 'errore password');
  ok('2. password errata rifiutata al ripristino', true);
  fill('p-input', P1); $('form-prompt').requestSubmit();
  await waitFor(() => visible('screen-main') && titles().includes('Gmail'), 'Gmail ripristinata');
  ok('2. ripristino su nuovo dispositivo', true);

  // 3. Modifica offline su B + modifica "da un altro dispositivo" su Drive -> unione
  window.fakeDrive.failNetwork = true;
  await addEntry('Banca', 'b-secret');
  await waitFor(() => $('sync-dot').dataset.state === 'err' || $('sync-dot').dataset.state === 'warn', 'stato errore/attesa sync');
  ok('3. senza rete la modifica resta locale', !live(await driveData(P1)).includes('Banca'));
  {
    const blob = driveBlob();
    const o = await C.openWithPassword(P1, blob);
    o.data.entries.push({ id: 'remote1', title: 'Remote', username: 'r', password: 'r-secret', updatedAt: Date.now(), createdAt: Date.now() });
    const f = vaultFile();
    f.content = JSON.stringify(await C.seal(o.key, o.kdf, o.data));
    f.modifiedTime = new Date(Date.now() + 1000).toISOString();
  }
  window.fakeDrive.failNetwork = false;
  $('btn-sync').click();
  await waitFor(() => titles().join() === 'Banca,Gmail,Remote', 'unione in locale');
  await waitFor(async () => live(await driveData(P1)).join() === 'Banca,Gmail,Remote', 'unione su Drive');
  ok('3. unione modifiche locali + remote', true);

  // 3b. Modifica remota con dispositivo senza modifiche locali -> deve essere scaricata
  {
    const o = await C.openWithPassword(P1, driveBlob());
    o.data.entries.push({ id: 'remote2', title: 'Remote2', password: 'x', updatedAt: Date.now(), createdAt: Date.now() });
    const f = vaultFile();
    f.content = JSON.stringify(await C.seal(o.key, o.kdf, o.data));
    f.modifiedTime = new Date(Date.now() + 2000).toISOString();
  }
  $('btn-sync').click();
  await waitFor(() => titles().includes('Remote2'), 'Remote2 scaricata');
  ok('3b. modifica remota scaricata', true);
  // 3c. Nessuna modifica da nessuna parte -> solo una richiesta di metadati, nessun download
  {
    const before = window.fakeDrive.calls.length;
    const lastSyncBefore = $('sync-label').textContent;
    $('btn-sync').click();
    await sleep(800);
    const newCalls = window.fakeDrive.calls.slice(before);
    ok(`3c. sync senza modifiche = 1 sola richiesta leggera (${newCalls.join(', ')})`, newCalls.length === 1 && lastSyncBefore);
  }
  // rimuove Remote2 per non alterare i conteggi successivi
  d().querySelectorAll('#list .item-main').forEach((b) => { if (b.textContent.includes('Remote2')) b.click(); });
  await waitFor(() => $('dlg-detail').open, 'dettaglio Remote2');
  $('d-edit').click(); $('e-delete').click();
  await waitFor(() => $('dlg-confirm').open, 'conferma');
  $('form-confirm').requestSubmit();
  await waitFor(() => titles().join() === 'Banca,Gmail,Remote', 'Remote2 eliminata');
  await waitFor(async () => live(await driveData(P1)).join() === 'Banca,Gmail,Remote', 'Remote2 eliminata su Drive');

  // 4. Cambio password principale
  $('btn-settings').click(); $('s-change-pwd').click();
  fill('c-old', P1); fill('c-new', P2); fill('c-new2', P2);
  $('form-chpwd').requestSubmit();
  await waitFor(async () => live(await driveData(P2)).length === 3, 'Drive con nuova password');
  ok('4. cambio password propagato su Drive', true);
  $('dlg-settings').close();

  // 5. Blocco / sblocco
  $('btn-lock').click();
  await waitFor(() => visible('screen-lock'), 'schermata blocco');
  ok('5. dati rimossi dal DOM al blocco', titles().length === 0);
  fill('unlock-pwd', P1); $('form-unlock').requestSubmit();
  await waitFor(() => !$('unlock-error').hidden, 'errore vecchia password');
  fill('unlock-pwd', P2); $('form-unlock').requestSubmit();
  await waitFor(() => visible('screen-main') && titles().length === 3, 'sblocco con nuova password');
  ok('5. sblocco con nuova password', true);

  // 6. Senza rete: si leggono le password dalla copia locale
  window.fakeDrive.failNetwork = true;
  await loadApp();
  await waitFor(() => visible('screen-lock'), 'blocco dopo riavvio');
  fill('unlock-pwd', P2); $('form-unlock').requestSubmit();
  await waitFor(() => visible('screen-main') && titles().join() === 'Banca,Gmail,Remote', 'lettura offline');
  ok('6. lettura offline dalla copia locale', true);
  window.fakeDrive.failNetwork = false;

  // 7. Dispositivo C con archivio locale separato (vecchia password) che poi collega Drive
  await deleteDb(); await loadApp();
  await waitFor(() => visible('screen-setup'), 'setup su C');
  fill('create-pwd', P1); fill('create-pwd2', P1); $('create-drive').checked = false;
  $('form-create').requestSubmit();
  await waitFor(() => visible('screen-main'), 'main su C');
  await addEntry('Solo locale', 'l-secret');
  $('btn-settings').click(); $('s-drive-connect').click();
  await waitFor(() => $('dlg-prompt').open, 'richiesta password del vault su Drive');
  fill('p-input', P2); $('form-prompt').requestSubmit();
  await waitFor(() => titles().length === 4, 'unione su C');
  await waitFor(async () => live(await driveData(P2)).length === 4, 'Drive con 4 voci');
  ok('7. unione tra archivi con password diverse (adotta la più recente)', true);
  $('dlg-settings').close();
  $('btn-lock').click();
  fill('unlock-pwd', P2); $('form-unlock').requestSubmit();
  await waitFor(() => visible('screen-main') && titles().length === 4, 'sblocco C con P2');
  ok('7. il dispositivo C ora usa la password più recente', true);

  // 8. Eliminazione propagata
  d().querySelector('#list .item-main').click(); // prima voce in ordine alfabetico: Banca
  await waitFor(() => $('dlg-detail').open, 'dettaglio');
  $('d-edit').click();
  $('e-delete').click();
  await waitFor(() => $('dlg-confirm').open, 'conferma eliminazione');
  $('form-confirm').requestSubmit();
  await waitFor(() => !titles().includes('Banca'), 'Banca rimossa');
  await waitFor(async () => !live(await driveData(P2)).includes('Banca'), 'Banca rimossa da Drive');
  ok('8. eliminazione propagata su Drive', true);

  // 9. Soggetti e categorie
  const chipBtn = (rowId, label) => [...$(rowId).querySelectorAll('.fchip')].find((b) => b.textContent === label);
  const promptText = async (v) => {
    await waitFor(() => $('dlg-prompt').open, 'richiesta nome');
    fill('p-input', v); $('form-prompt').requestSubmit();
  };
  chipBtn('subj-chips', '+ Soggetto').click();
  await promptText('Mario');
  await waitFor(() => chipBtn('subj-chips', 'Mario')?.classList.contains('active'), 'soggetto Mario selezionato');
  chipBtn('cat-chips', '+ Categoria').click();
  await promptText('Banca');
  await waitFor(() => chipBtn('cat-chips', 'Banca')?.classList.contains('active'), 'categoria Banca selezionata');
  chipBtn('cat-chips', '+ Categoria').click();
  await promptText('banca');
  await waitFor(() => !$('p-error').hidden, 'nome duplicato rifiutato');
  ok('9. nome di categoria duplicato rifiutato', true);
  fill('p-input', 'Email'); $('form-prompt').requestSubmit();
  await waitFor(() => chipBtn('cat-chips', 'Email')?.classList.contains('active'), 'categoria Email');
  chipBtn('cat-chips', 'Banca').click();
  await addEntry('Conto Mario', 'cm-secret');
  ok('9. nuova voce eredita soggetto e categoria dal filtro', titles().join() === 'Conto Mario');

  // secondo soggetto con una categoria dallo stesso nome
  chipBtn('subj-chips', '+ Soggetto').click();
  await promptText('Ditta');
  await waitFor(() => chipBtn('subj-chips', 'Ditta')?.classList.contains('active'), 'soggetto Ditta');
  ok('9. il nuovo soggetto parte senza voci', titles().length === 0);
  chipBtn('cat-chips', '+ Categoria').click();
  await waitFor(() => $('dlg-prompt').open, 'prompt categoria');
  ok('9. suggerisce le categorie degli altri soggetti', [...$('p-suggest').options].map((o) => o.value).join() === 'Banca,Email');
  fill('p-input', 'Banca'); $('form-prompt').requestSubmit();
  await waitFor(() => chipBtn('cat-chips', 'Banca')?.classList.contains('active'), 'Banca di Ditta');
  await addEntry('Conto Ditta', 'cd-secret');

  // spostamento di una voce senza soggetto dal modulo di modifica
  chipBtn('subj-chips', 'Tutti').click();
  await waitFor(() => d().querySelectorAll('#list .group').length >= 3, 'gruppi in "Tutti"');
  const groups = [...d().querySelectorAll('#list .group')].map((g) => g.textContent);
  ok(`9. "Tutti" raggruppa per soggetto › categoria (${groups.join(' / ')})`, groups[0] === 'Ditta › Banca' && groups[1] === 'Mario › Banca' && groups.at(-1) === 'Senza soggetto');
  [...d().querySelectorAll('#list .item-main')].find((b) => b.textContent.includes('Gmail')).click();
  await waitFor(() => $('dlg-detail').open, 'dettaglio Gmail');
  $('d-edit').click();
  const mid = [...$('e-subject').options].find((o) => o.textContent === 'Mario').value;
  $('e-subject').value = mid; $('e-subject').dispatchEvent(new Event('change'));
  await waitFor(() => !$('e-category').disabled, 'categorie di Mario');
  $('e-category').value = [...$('e-category').options].find((o) => o.textContent === 'Email').value;
  $('form-edit').requestSubmit();
  chipBtn('subj-chips', 'Mario').click();
  chipBtn('cat-chips', 'Email').click();
  await waitFor(() => titles().join() === 'Gmail', 'Gmail in Mario › Email');
  ok('9. voce spostata in Mario › Email', true);
  await waitFor(() => $('toast').textContent === 'Salvato', 'salvataggio completato');

  // eliminazione di un soggetto non vuoto rifiutata
  $('btn-manage').click();
  await waitFor(() => $('dlg-manage').open, 'gestione');
  const row = [...$('m-tree').querySelectorAll('.tree-subject')].find((li) => li.querySelector('.tree-name').textContent === 'Mario');
  row.querySelector('[title=Elimina]').click();
  await waitFor(() => $('toast').textContent.includes('Impossibile'), 'avviso eliminazione', 3000).catch(() => {});
  ok('9. soggetto con password non eliminabile', !$('dlg-confirm').open && !$('toast').hidden && $('toast').textContent.includes('Impossibile'));
  // rinomina
  row.querySelector('[title=Rinomina]').click();
  await promptText('Mario Rossi');
  await waitFor(() => chipBtn('subj-chips', 'Mario Rossi'), 'soggetto rinominato');
  $('dlg-manage').close();

  // sincronizzazione su un altro dispositivo
  await waitFor(async () => { const dd = await driveData(P2); return dd.subjects.some((s) => s.name === 'Mario Rossi') && live(dd).includes('Conto Ditta'); }, 'soggetti su Drive');
  await deleteDb(); await loadApp();
  await waitFor(() => visible('screen-setup'), 'setup dispositivo D');
  $('btn-restore').click();
  await promptText(P2);
  await waitFor(() => visible('screen-main') && chipBtn('subj-chips', 'Mario Rossi') && chipBtn('subj-chips', 'Ditta'), 'soggetti sul dispositivo D');
  chipBtn('subj-chips', 'Mario Rossi').click();
  await waitFor(() => chipBtn('cat-chips', 'Banca') && chipBtn('cat-chips', 'Email'), 'categorie su D');
  ok('9. soggetti e categorie sincronizzati su un altro dispositivo', titles().join() === 'Conto Mario,Gmail');

  // 10. Modalità riservata
  const subs = () => [...d().querySelectorAll('#list .item-sub')].map((n) => n.textContent);
  ok('10. utenti visibili senza modalità riservata', subs().includes('gmail@x.it'));
  $('btn-privacy').click();
  await waitFor(() => d().body.classList.contains('privacy') && subs().every((t) => t === '••••••••'), 'utenti coperti');
  ok('10. utenti coperti nell\'elenco', true);
  [...d().querySelectorAll('#list .item-main')].find((b) => b.textContent.includes('Gmail')).click();
  await waitFor(() => $('dlg-detail').open, 'dettaglio');
  ok('10. utente coperto nel dettaglio', $('d-user').textContent === '••••••••');
  $('d-reveal').click();
  ok('10. il click non rivela la password', $('d-pwd').textContent === '••••••••');
  const PE = frame.contentWindow.PointerEvent;
  $('d-reveal').dispatchEvent(new PE('pointerdown', { bubbles: true, cancelable: true }));
  ok('10. tenendo premuto la password si vede', $('d-pwd').textContent === 'g-secret');
  frame.contentWindow.dispatchEvent(new PE('pointerup'));
  ok('10. rilasciando torna coperta', $('d-pwd').textContent === '••••••••');
  $('d-user').dispatchEvent(new PE('pointerdown', { bubbles: true, cancelable: true }));
  const userShown = $('d-user').textContent;
  frame.contentWindow.dispatchEvent(new PE('pointerup'));
  ok('10. tenendo premuto l\'utente si vede', userShown === 'gmail@x.it' && $('d-user').textContent === '••••••••');
  d().querySelector('#dlg-detail [data-copy=password]').click();
  await waitFor(() => $('dlg-confirm').open, 'avviso appunti');
  ok('10. avviso prima di copiare', $('cf-msg').textContent.includes('desktop remoto'));
  $('cf-cancel').click();
  frame.contentWindow.dispatchEvent(new Event('blur'));
  ok('10. finestra senza focus: contenuto nascosto', !$('shield').hidden && d().body.classList.contains('shielded'));
  frame.contentWindow.dispatchEvent(new Event('focus'));
  ok('10. focus ritrovato: contenuto visibile', $('shield').hidden);
  const esc = () => d().dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  esc(); esc();
  await waitFor(() => visible('screen-lock'), 'blocco con doppio Esc');
  ok('10. doppio Esc blocca l\'app', $('d-pwd').textContent === '' && titles().length === 0);
  fill('unlock-pwd', P2); $('form-unlock').requestSubmit();
  await waitFor(() => visible('screen-main'), 'sblocco');
  ok('10. la modalità riservata resta attiva dopo lo sblocco', d().body.classList.contains('privacy'));
  $('btn-privacy').click();

  // 11. Link pagina di login
  $('btn-add').click();
  fill('e-title', 'Con login'); fill('e-url', 'banca.example/login'); fill('e-pwd', 'x');
  $('form-edit').requestSubmit();
  await waitFor(() => titles().includes('Con login'), 'voce con link');
  const li = [...d().querySelectorAll('#list .item')].find((n) => n.textContent.includes('Con login'));
  const a = li.querySelector('a.icon-btn');
  ok('11. pulsante "apri login" nell\'elenco', a && a.href === 'https://banca.example/login' && a.target === '_blank');
  li.querySelector('.item-main').click();
  await waitFor(() => $('dlg-detail').open, 'dettaglio con link');
  ok('11. link nel dettaglio', !$('d-open').hidden && $('d-open').href === 'https://banca.example/login');
  $('dlg-detail').close();
  $('btn-add').click();
  fill('e-title', 'Link pericoloso'); fill('e-url', 'javascript:alert(1)'); fill('e-pwd', 'x');
  $('form-edit').requestSubmit();
  await waitFor(() => titles().includes('Link pericoloso'), 'voce link pericoloso');
  const li2 = [...d().querySelectorAll('#list .item')].find((n) => n.textContent.includes('Link pericoloso'));
  ok('11. link "javascript:" non diventa cliccabile', !li2.querySelector('a.icon-btn'));

  // 12. Copia utente dall'elenco e dal modulo
  const copied = [];
  frame.contentWindow.navigator.clipboard.writeText = async (t) => { copied.push(t); };
  const gm = [...d().querySelectorAll('#list .item')].find((n) => n.textContent.includes('Gmail'));
  gm.querySelector('[title="Copia utente"]').click();
  await waitFor(() => copied.includes('gmail@x.it'), 'copia utente dall\'elenco');
  ok('12. copia utente dall\'elenco', true);
  gm.querySelector('[title="Copia password"]').click();
  await waitFor(() => copied.includes('g-secret'), 'copia password dall\'elenco');
  ok('12. copia password dall\'elenco', true);
  gm.querySelector('.item-main').click();
  await waitFor(() => $('dlg-detail').open, 'dettaglio Gmail');
  $('d-edit').click();
  $('e-copy-user').click();
  $('e-copy-pwd').click();
  await waitFor(() => copied.filter((t) => t === 'gmail@x.it').length === 2 && copied.filter((t) => t === 'g-secret').length === 2, 'copia dal modulo');
  ok('12. copia utente e password dal modulo di modifica', true);

  // 13. Cestino
  const t0 = V_trashCount();
  $('e-delete').click();
  await waitFor(() => $('dlg-confirm').open, 'conferma cestino');
  ok('13. l\'eliminazione chiede di spostare nel cestino', $('cf-title').textContent.includes('cestino'));
  $('form-confirm').requestSubmit();
  await waitFor(() => !titles().includes('Gmail') && !$('btn-trash').hidden && V_trashCount() === t0 + 1, 'Gmail nel cestino');
  await waitFor(async () => trashed(await driveData(P2)).includes('Gmail'), 'cestino sincronizzato su Drive');
  ok('13. voce nel cestino (anche su Drive), non più in elenco', true);
  $('btn-trash').click();
  await waitFor(() => $('dlg-trash').open && $('t-list').textContent.includes('Gmail'), 'cestino aperto');
  [...$('t-list').querySelectorAll('button')].find((b) => b.textContent === 'Ripristina').click();
  await waitFor(() => titles().includes('Gmail') && V_trashCount() === t0, 'Gmail ripristinata');
  ok('13. ripristino dal cestino con tutti i dati', true);
  {
    const gm2 = [...d().querySelectorAll('#list .item')].find((n) => n.textContent.includes('Gmail'));
    gm2.querySelector('[title="Copia password"]').click();
    await waitFor(() => copied.filter((t) => t === 'g-secret').length === 3, 'password dopo ripristino');
    ok('13. la password ripristinata è intatta', true);
  }
  $('dlg-trash').close();
  // due voci nel cestino, poi svuota con conferma scritta
  for (const name of ['Con login', 'Link pericoloso']) {
    [...d().querySelectorAll('#list .item-main')].find((b) => b.textContent.includes(name)).click();
    await waitFor(() => $('dlg-detail').open, 'dettaglio ' + name);
    $('d-edit').click(); $('e-delete').click();
    await waitFor(() => $('dlg-confirm').open, 'conferma');
    $('form-confirm').requestSubmit();
    await waitFor(() => !titles().includes(name), name + ' nel cestino');
  }
  ok('13. contatore cestino', V_trashCount() === t0 + 2);
  $('btn-trash').click();
  await waitFor(() => $('dlg-trash').open, 'cestino');
  $('t-empty-btn').click();
  await waitFor(() => $('dlg-prompt').open, 'conferma scritta');
  fill('p-input', 'si'); $('form-prompt').requestSubmit();
  await waitFor(() => !$('p-error').hidden, 'parola sbagliata rifiutata');
  ok('13. svuota cestino: conferma sbagliata rifiutata', V_trashCount() === t0 + 2);
  fill('p-input', 'svuota'); $('form-prompt').requestSubmit();
  await waitFor(() => !$('dlg-prompt').open && $('btn-trash').hidden, 'cestino svuotato');
  await waitFor(async () => { const dd = await driveData(P2); return trashed(dd).length === 0 && dd.entries.filter((e) => e.deleted).length >= 2; }, 'svuotamento su Drive');
  ok('13. cestino svuotato definitivamente (anche su Drive)', true);

  // 14. Allegati
  const secretText = 'contenuto segreto del contratto 12345';
  const attachFile = (name, content, type = 'text/plain') => {
    const W = frame.contentWindow;
    const dt = new W.DataTransfer();
    dt.items.add(new W.File([content], name, { type }));
    $('e-att-file').files = dt.files;
    $('e-att-file').dispatchEvent(new Event('change'));
  };
  const openGmail = async () => {
    [...d().querySelectorAll('#list .item-main')].find((b) => b.textContent.includes('Gmail')).click();
    await waitFor(() => $('dlg-detail').open, 'dettaglio Gmail');
  };
  const captureBlobs = () => {
    const W = frame.contentWindow;
    const list = [];
    const orig = W.URL.createObjectURL.bind(W.URL);
    W.URL.createObjectURL = (b) => { list.push(b); return orig(b); };
    return list;
  };
  const downloadAtt = async (name, list) => {
    const n = list.length;
    [...$('d-att-list').querySelectorAll('li')].find((li) => li.textContent.includes(name)).querySelector('[title=Scarica]').click();
    await waitFor(() => list.length === n + 1, 'download ' + name);
    return list[n].text();
  };

  await openGmail();
  ok('14. nessun allegato: sezione nascosta', $('d-att-row').hidden);
  $('d-edit').click();
  attachFile('contratto.txt', secretText);
  await waitFor(() => $('e-att-list').textContent.includes('contratto.txt'), 'allegato nel modulo');
  attachFile('foto.png', new Uint8Array([137, 80, 78, 71, 1, 2, 3]), 'image/png');
  await waitFor(() => $('e-att-list').children.length === 2, 'due allegati');
  $('form-edit').requestSubmit();
  await waitFor(() => titles().some((t) => t.includes('Gmail') && t.includes('📎')), 'graffetta in elenco');
  ok('14. graffetta nell\'elenco', true);
  await waitFor(() => driveAtts().length === 2, 'allegati caricati su Drive');
  {
    const raw = driveAtts().map((f) => new TextDecoder().decode(f.content)).join('');
    ok('14. allegati su Drive come file separati e cifrati', !raw.includes('segreto') && !vaultFile().content.includes('segreto'));
    const g = (await driveData(P2)).entries.find((e) => e.title === 'Gmail');
    ok('14. metadati allegati nel vault cifrato', g.attachments.length === 2 && !!g.attachments[0].key);
  }
  let blobs = captureBlobs();
  await openGmail();
  ok('14. allegato decifrato correttamente', (await downloadAtt('contratto.txt', blobs)) === secretText);
  $('dlg-detail').close();

  // nuovo dispositivo: gli allegati arrivano da Drive e si aprono offline
  await deleteDb(); await loadApp();
  await waitFor(() => visible('screen-setup'), 'setup dispositivo E');
  $('btn-restore').click();
  await promptText(P2);
  await waitFor(() => visible('screen-main'), 'main su E');
  $('btn-sync').click();
  await waitFor(() => $('sync-dot').dataset.state === 'ok', 'sync su E');
  await sleep(500);
  window.fakeDrive.failNetwork = true;
  await loadApp();
  await waitFor(() => visible('screen-lock'), 'blocco E');
  fill('unlock-pwd', P2); $('form-unlock').requestSubmit();
  await waitFor(() => visible('screen-main'), 'sblocco E offline');
  blobs = captureBlobs();
  await openGmail();
  ok('14. allegato disponibile offline su un altro dispositivo', (await downloadAtt('contratto.txt', blobs)) === secretText);
  window.fakeDrive.failNetwork = false;
  $('dlg-detail').close();

  // rimozione di un allegato: sparisce anche da Drive
  await openGmail();
  $('d-edit').click();
  const removeFoto = () => [...$('e-att-list').querySelectorAll('li')].find((li) => li.textContent.includes('foto.png')).querySelector('[title="Rimuovi allegato"]').click();
  removeFoto();
  await waitFor(() => $('dlg-confirm').open, 'conferma rimozione allegato');
  $('cf-cancel').click();
  await waitFor(() => !$('dlg-confirm').open, 'conferma chiusa');
  ok('14. annullando la conferma l\'allegato resta', $('e-att-list').textContent.includes('foto.png'));
  removeFoto();
  await waitFor(() => $('dlg-confirm').open, 'conferma rimozione allegato');
  $('form-confirm').requestSubmit();
  await waitFor(() => !$('e-att-list').textContent.includes('foto.png'), 'allegato tolto dal modulo');
  $('form-edit').requestSubmit();
  await waitFor(() => driveAtts().length === 1, 'allegato rimosso da Drive');
  ok('14. allegato rimosso anche da Drive', true);

  // cambio password principale: gli allegati restano leggibili
  $('btn-settings').click(); $('s-change-pwd').click();
  const P3 = 'terza-password-789';
  fill('c-old', P2); fill('c-new', P3); fill('c-new2', P3);
  $('form-chpwd').requestSubmit();
  await waitFor(async () => { try { return !!(await driveData(P3)); } catch { return false; } }, 'nuova password su Drive');
  $('dlg-settings').close();
  await openGmail();
  ok('14. allegati leggibili dopo il cambio della password principale', (await downloadAtt('contratto.txt', blobs)) === secretText);
  $('dlg-detail').close();

  // cestino e svuotamento: allegati eliminati da Drive solo allo svuotamento
  await openGmail();
  $('d-edit').click(); $('e-delete').click();
  await waitFor(() => $('dlg-confirm').open, 'conferma');
  $('form-confirm').requestSubmit();
  await waitFor(() => !$('btn-trash').hidden, 'nel cestino');
  await sleep(2500);
  ok('14. nel cestino gli allegati restano su Drive', driveAtts().length === 1);
  $('btn-trash').click();
  await waitFor(() => $('dlg-trash').open, 'cestino');
  $('t-empty-btn').click();
  await promptText('SVUOTA');
  await waitFor(() => driveAtts().length === 0, 'allegati eliminati da Drive');
  ok('14. svuotando il cestino gli allegati spariscono da Drive', true);

  // ordinamento: per nome oppure per data di creazione
  for (const t of ['Ord-Zeta', 'Ord-Alfa', 'Ord-Mezzo']) { await addEntry(t, 'x-' + t); await sleep(20); }
  const shown = () => [...d().querySelectorAll('#list .item-title')].map((n) => n.textContent).filter((t) => t.startsWith('Ord-'));
  const setSort = (v) => { $('sort').value = v; $('sort').dispatchEvent(new Event('change')); };
  setSort('name');
  await waitFor(() => shown().join() === 'Ord-Alfa,Ord-Mezzo,Ord-Zeta', 'ordine A-Z');
  ok('15. ordine alfabetico', true);
  setSort('newest');
  await waitFor(() => shown().join() === 'Ord-Mezzo,Ord-Alfa,Ord-Zeta', 'ordine più recenti');
  ok('15. ordine per creazione, più recenti prima', !d().querySelector('#list .group'));
  setSort('oldest');
  await waitFor(() => shown().join() === 'Ord-Zeta,Ord-Alfa,Ord-Mezzo', 'ordine meno recenti');
  ok('15. ordine per creazione, meno recenti prima', true);
  setSort('name');

  // chiusura della modifica: conferma solo se ci sono cambiamenti non salvati
  const closeBtn = () => $('dlg-edit').querySelector('[data-close]');
  $('btn-add').click();
  closeBtn().click();
  await sleep(100);
  ok('16. senza modifiche si chiude senza chiedere', !$('dlg-edit').open && !$('dlg-confirm').open);
  $('btn-add').click();
  fill('e-title', 'Non-salvata');
  closeBtn().click();
  await waitFor(() => $('dlg-confirm').open, 'conferma modifiche non salvate');
  $('cf-cancel').click();
  await waitFor(() => !$('dlg-confirm').open, 'conferma chiusa');
  ok('16. annullando resta nella modifica con i dati', $('dlg-edit').open && $('e-title').value === 'Non-salvata');
  closeBtn().click();
  await waitFor(() => $('dlg-confirm').open, 'conferma modifiche non salvate');
  $('form-confirm').requestSubmit();
  await waitFor(() => !$('dlg-edit').open, 'modifica chiusa');
  ok('16. confermando le modifiche vengono scartate', !titles().includes('Non-salvata'));
} catch (e) {
  log('FAIL ' + e.message);
  try { log('DEBUG sync=' + $('sync-label').textContent + ' / ' + $('btn-sync').title + ' calls=' + window.fakeDrive.calls.slice(-6).join(',') + ' dlg=' + [...d().querySelectorAll('dialog[open]')].map(x=>x.id) + ' cerr=' + $('c-error').textContent); } catch {}
}
log('chiamate Drive: ' + window.fakeDrive?.calls.length);
console.log('E2ERESULT ' + results.join(' | '));
</script>
